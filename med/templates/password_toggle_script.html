<style>
    .password-input-wrapper {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        min-width: 0;
    }

    .password-input-wrapper > input {
        width: 100%;
        padding-right: 2.75rem !important;
    }

    .password-toggle-button {
        position: absolute;
        top: 50%;
        right: .4rem;
        transform: translateY(-50%);

        display: grid;
        place-items: center;

        width: 2.25rem;
        height: 2.25rem;

        padding: 0;

        border: 0;
        border-radius: .5rem;

        background: transparent;

        color: #64748B;

        cursor: pointer;

        transition:
            background .2s ease,
            color .2s ease;
    }

    .password-toggle-button:hover {
        background: #E9F5FC;
        color: #073D70;
    }

    .password-toggle-button:active {
        background: #D7EBF8;
        color: #E86B4C;
    }

    .password-toggle-button:focus-visible {
        outline: 2px solid #174EA6;
        outline-offset: 2px;
    }

    .password-toggle-button i {
        font-size: 14px;
        transition: color .2s ease;
    }
</style>


<script>
    document.addEventListener('DOMContentLoaded', function () {

        document.querySelectorAll('input[type="password"]').forEach(function (passwordInput) {

            /* Prevent duplicate toggle buttons */
            if (
                passwordInput.parentElement &&
                passwordInput.parentElement.classList.contains('password-input-wrapper')
            ) {
                return;
            }


            /* Create wrapper */
            const wrapper = document.createElement('div');

            wrapper.className = 'password-input-wrapper';


            /* Insert wrapper before password input */
            passwordInput.parentNode.insertBefore(
                wrapper,
                passwordInput
            );


            /* Move password input inside wrapper */
            wrapper.appendChild(passwordInput);


            /* Create toggle button */
            const toggleButton = document.createElement('button');

            toggleButton.className = 'password-toggle-button';

            toggleButton.type = 'button';

            toggleButton.setAttribute(
                'aria-label',
                'Show password'
            );

            toggleButton.setAttribute(
                'aria-pressed',
                'false'
            );

            toggleButton.setAttribute(
                'title',
                'Show password'
            );


            /* Create icon */
            const icon = document.createElement('i');

            icon.className = 'fa-solid fa-eye';

            icon.setAttribute(
                'aria-hidden',
                'true'
            );


            toggleButton.appendChild(icon);

            wrapper.appendChild(toggleButton);


            /* Toggle password visibility */
            toggleButton.addEventListener('click', function () {

                const isVisible =
                    passwordInput.type === 'password';


                passwordInput.type =
                    isVisible ? 'text' : 'password';


                toggleButton.setAttribute(
                    'aria-pressed',
                    String(isVisible)
                );


                toggleButton.setAttribute(
                    'aria-label',
                    isVisible
                        ? 'Hide password'
                        : 'Show password'
                );


                toggleButton.setAttribute(
                    'title',
                    isVisible
                        ? 'Hide password'
                        : 'Show password'
                );


                icon.className =
                    isVisible
                        ? 'fa-solid fa-eye-slash'
                        : 'fa-solid fa-eye';

            });

        });

    });
</script>
