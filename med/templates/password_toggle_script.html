<style>
    .password-input-wrapper {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        min-width: 0;
    }

    .password-input-wrapper > input {
        width: 100%;
        padding-right: 2.75rem !important;
    }

    .password-toggle-button {
        position: absolute;
        top: 50%;
        right: .4rem;
        transform: translateY(-50%);
        display: grid;
        place-items: center;
        width: 2.25rem;
        height: 2.25rem;
        padding: 0;
        border: 0;
        border-radius: .5rem;
        background: transparent;
        color: #64748b;
        cursor: pointer;
    }

    .password-toggle-button:hover {
        background: #edf4ff;
        color: #174ea6;
    }

    .password-toggle-button:focus-visible {
        outline: 2px solid #174ea6;
        outline-offset: 2px;
    }
</style>
<script>
    document.querySelectorAll('input[type="password"]').forEach(function (passwordInput) {
        const wrapper = document.createElement('div');
        wrapper.className = 'password-input-wrapper';
        passwordInput.parentNode.insertBefore(wrapper, passwordInput);
        wrapper.appendChild(passwordInput);

        const toggleButton = document.createElement('button');
        toggleButton.className = 'password-toggle-button';
        toggleButton.type = 'button';
        toggleButton.setAttribute('aria-label', 'Show password');
        toggleButton.setAttribute('aria-pressed', 'false');
    toggleButton.setAttribute('title', 'Show password');

        const icon = document.createElement('i');
        icon.className = 'fa-solid fa-eye';
        icon.setAttribute('aria-hidden', 'true');
        toggleButton.appendChild(icon);
        wrapper.appendChild(toggleButton);

        toggleButton.addEventListener('click', function () {
            const isVisible = passwordInput.type === 'password';
            passwordInput.type = isVisible ? 'text' : 'password';
            toggleButton.setAttribute('aria-pressed', String(isVisible));
            toggleButton.setAttribute('aria-label', isVisible ? 'Hide password' : 'Show password');
            toggleButton.setAttribute('title', isVisible ? 'Hide password' : 'Show password');
            icon.className = isVisible ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });
    });
</script>
