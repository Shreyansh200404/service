{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="card mx-auto text-center shadow-sm" style="max-width:620px">
        <div class="card-body p-5">
            <span class="rounded-3 p-3 bg-success-subtle text-success d-inline-block mb-3"><i class="fa-solid fa-paper-plane fa-xl"></i></span>
            <h1 class="h3 fw-bold">Request sent</h1>
            <p class="text-muted">An administrator will review your account request. If approved, they will provide your username and initial password separately.</p>
            <a href="{% url 'login' %}" class="btn btn-primary">Return to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
