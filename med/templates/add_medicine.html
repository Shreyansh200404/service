{% extends 'admin_base.html' %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center">

    <div class="card custom-card">

        <!-- Header -->

        <div class="card-header text-center">

            <div class="icon-box">

                <i class="fa-solid fa-capsules"></i>

            </div>

            <h2 class="mt-3">
                Add Medicine
            </h2>

            <p class="text-light">
                Add medicine details under a diagnosis
            </p>

        </div>

        <!-- Body -->

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <!-- Diagnosis -->

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        Select Diagnosis

                    </label>

                    <select name="diagnosis"
                            class="form-select custom-input"
                            required>

                        <option value="">
                            Choose Diagnosis
                        </option>

                        {% for item in diagnosis %}

                        <option value="{{ item.id }}">

                            {{ item.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Medicine Name -->

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        Medicine Name

                    </label>

                    <input type="text"
                           name="name"
                           class="form-control custom-input"
                           placeholder="Enter medicine name"
                           required>

                </div>

                <!-- Dosage -->

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        Dosage

                    </label>

                    <input type="text"
                           name="dosage"
                           class="form-control custom-input"
                           placeholder="Example : 500mg / OD"
                           required>

                </div>

                <!-- Buttons -->

                <div class="d-flex justify-content-between">

                    <a href="/admin-dashboard/"
                       class="btn btn-secondary btn-custom">

                        <i class="fa-solid fa-arrow-left"></i>
                        Back

                    </a>

                    <button type="submit"
                            class="btn btn-primary btn-custom">

                        <i class="fa-solid fa-plus"></i>
                        Save Medicine

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<style>

    body{
        background:#eef4ff;
    }

    .custom-card{
        width:100%;
        max-width:650px;
        border:none;
        border-radius:22px;
        overflow:hidden;
        margin-top:40px;
        box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    .card-header{
        background:linear-gradient(to right,#2563eb,#06b6d4);
        padding:35px;
        color:white;
    }

    .icon-box{
        width:85px;
        height:85px;
        background:white;
        border-radius:50%;
        display:flex;
        justify-content:center;
        align-items:center;
        margin:auto;
        color:#2563eb;
        font-size:38px;
        box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .card-body{
        padding:40px;
        background:white;
    }

    .custom-input{
        padding:14px;
        border-radius:12px;
        border:1px solid #d1d5db;
        transition:0.3s;
        font-size:15px;
    }

    .custom-input:focus{
        border-color:#2563eb;
        box-shadow:0 0 10px rgba(37,99,235,0.25);
    }

    .btn-custom{
        padding:12px 22px;
        border-radius:10px;
        font-weight:600;
        transition:0.3s;
    }

    .btn-primary{
        background:#2563eb;
        border:none;
    }

    .btn-primary:hover{
        background:#1d4ed8;
    }

    .btn-secondary:hover{
        background:#4b5563;
    }

</style>

{% endblock %}
