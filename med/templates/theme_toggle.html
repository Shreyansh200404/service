<style>
    :root {
        --navy: #073D70;
        --navy-dark: #123F78;
        --navy-light: #174EA6;

        --coral: #E86B4C;
        --coral-dark: #D95638;
        --coral-soft: #FFF0EB;

        --cream: #FFF4DF;
        --cream-dark: #FFE8C4;

        --blue-light: #E9F5FC;
        --blue-border: #D7EBF8;

        --text: #172033;
        --muted: #64748B;
        --border: #DCE5ED;

        --theme-bg: #F8FBFD;
        --theme-surface: #FFFFFF;
        --theme-surface-raised: #F5F9FC;
        --theme-ink: #172033;
        --theme-muted: #64748B;
        --theme-link: #174EA6;
        --theme-input: #FFFFFF;
    }


    /* =========================================
       THEME TOGGLE BUTTON
    ========================================= */

    .theme-toggle {
        display: inline-grid;
        place-items: center;

        width: 40px;
        height: 40px;

        flex: 0 0 40px;

        padding: 0;

        border: 1px solid var(--border);
        border-radius: 10px;

        background: #fff;

        color: var(--navy);

        cursor: pointer;

        transition:
            background .2s ease,
            color .2s ease,
            border-color .2s ease,
            transform .2s ease;
    }

    .theme-toggle:hover {
        background: var(--blue-light);

        border-color: var(--blue-border);

        color: var(--coral);

        transform: translateY(-1px);
    }

    .theme-toggle:focus-visible {
        outline: 2px solid var(--navy-light);

        outline-offset: 2px;
    }

    .theme-toggle i {
        font-size: 15px;
    }


    /* =========================================
       DARK THEME VARIABLES
    ========================================= */

    html[data-theme="dark"] {
        color-scheme: dark;

        --theme-bg: #101923;
        --theme-surface: #172432;
        --theme-surface-raised: #1E2D3C;

        --theme-ink: #E7EDF4;
        --theme-muted: #A9B7C6;

        --theme-border: #344556;

        --theme-link: #8AB4F8;

        --theme-input: #111D29;
    }


    /* =========================================
       BODY
    ========================================= */

    html[data-theme="dark"] body {
        background: var(--theme-bg) !important;

        color: var(--theme-ink) !important;
    }


    html[data-theme="dark"] main {
        background: var(--theme-bg);
    }


    html[data-theme="dark"] .content-container {
        background: var(--theme-bg);
    }


    /* =========================================
       NAVBAR
    ========================================= */

    html[data-theme="dark"] .navbar-custom {
        background: #121E2A !important;

        border-color: var(--theme-border) !important;

        color: var(--theme-ink) !important;
    }


    html[data-theme="dark"] .navbar-title {
        color: var(--theme-ink) !important;
    }


    html[data-theme="dark"] .navbar-subtitle {
        color: var(--theme-muted) !important;
    }


    /* =========================================
       HEADINGS
    ========================================= */

    html[data-theme="dark"] h1,
    html[data-theme="dark"] h2,
    html[data-theme="dark"] h3,
    html[data-theme="dark"] h4,
    html[data-theme="dark"] h5,
    html[data-theme="dark"] h6,
    html[data-theme="dark"] .dashboard-title,
    html[data-theme="dark"] .medicine-title,
    html[data-theme="dark"] .login-title,
    html[data-theme="dark"] .diagnosis-name,
    html[data-theme="dark"] .medicine-name {
        color: var(--theme-ink) !important;
    }


    /* =========================================
       MUTED TEXT
    ========================================= */

    html[data-theme="dark"] .text-muted,
    html[data-theme="dark"] .dashboard-subtitle,
    html[data-theme="dark"] .medicine-subtitle,
    html[data-theme="dark"] .footer-text {
        color: var(--theme-muted) !important;
    }


    /* =========================================
       LABELS
    ========================================= */

    html[data-theme="dark"] label,
    html[data-theme="dark"] .form-label {
        color: var(--theme-ink) !important;
    }


    /* =========================================
       CARDS / SURFACES
    ========================================= */

    html[data-theme="dark"] .card,
    html[data-theme="dark"] .card-body,
    html[data-theme="dark"] .card-header,
    html[data-theme="dark"] .card-footer,
    html[data-theme="dark"] .table-card,
    html[data-theme="dark"] .dashboard-card,
    html[data-theme="dark"] .diagnosis-box,
    html[data-theme="dark"] .login-card {
        background-color: var(--theme-surface) !important;

        color: var(--theme-ink) !important;

        border-color: var(--theme-border) !important;
    }


    html[data-theme="dark"] .bg-white,
    html[data-theme="dark"] .bg-light,
    html[data-theme="dark"] .text-bg-light {
        background-color: var(--theme-surface-raised) !important;

        color: var(--theme-ink) !important;
    }


    html[data-theme="dark"] .login-subtitle {
        color: var(--theme-muted) !important;
    }


    /* =========================================
       LINKS
    ========================================= */

    html[data-theme="dark"] a:not(.btn):not(.nav-link) {
        color: var(--theme-link);
    }


    html[data-theme="dark"] a:not(.btn):not(.nav-link):hover {
        color: #B9D2FF;
    }


    /* =========================================
       TABLES
    ========================================= */

    html[data-theme="dark"] .table {
        --bs-table-color: var(--theme-ink);
        --bs-table-bg: var(--theme-surface);
        --bs-table-border-color: var(--theme-border);

        --bs-table-striped-bg: #1B2A39;
        --bs-table-hover-bg: #223548;

        color: var(--theme-ink) !important;
    }


    html[data-theme="dark"] .table-light {
        --bs-table-color: var(--theme-ink);
        --bs-table-bg: var(--theme-surface-raised);
        --bs-table-border-color: var(--theme-border);
    }


    html[data-theme="dark"] .table > :not(caption) > * > * {
        border-color: var(--theme-border);
    }


    /* =========================================
       FORMS
    ========================================= */

    html[data-theme="dark"] .form-control,
    html[data-theme="dark"] .form-select,
    html[data-theme="dark"] .input-group-text {
        background-color: var(--theme-input) !important;

        color: var(--theme-ink) !important;

        border-color: var(--theme-border) !important;
    }


    html[data-theme="dark"] .form-control::placeholder {
        color: #91A0B0;
    }


    html[data-theme="dark"] .form-control:focus,
    html[data-theme="dark"] .form-select:focus {
        border-color: #8AB4F8 !important;

        box-shadow:
            0 0 0 .2rem rgb(138 180 248 / 20%) !important;
    }


    html[data-theme="dark"] textarea {
        background-color: var(--theme-input) !important;

        color: var(--theme-ink) !important;
    }


    html[data-theme="dark"] input[type="file"] {
        color: var(--theme-ink) !important;
    }


    /* =========================================
       COMMON BUTTONS
    ========================================= */

    html[data-theme="dark"] .btn-back,
    html[data-theme="dark"] .btn-home {
        background: #24364A !important;

        color: #D9E8FF !important;

        border-color: #3D5369 !important;
    }


    html[data-theme="dark"] .btn-medicine {
        background: #245B91 !important;

        color: #fff !important;
    }


    html[data-theme="dark"] .btn-outline-secondary,
    html[data-theme="dark"] .btn-outline-primary {
        color: #C5D9F5 !important;

        border-color: #71869B !important;
    }


    html[data-theme="dark"] .btn-outline-secondary:hover,
    html[data-theme="dark"] .btn-outline-primary:hover {
        background: #24364A !important;

        color: #fff !important;
    }


    /* Keep SEVA ONE primary coral buttons visible in dark mode */
    html[data-theme="dark"] .btn-primary {
        background: var(--coral) !important;

        border-color: var(--coral) !important;

        color: #fff !important;
    }


    html[data-theme="dark"] .btn-primary:hover {
        background: var(--coral-dark) !important;

        border-color: var(--coral-dark) !important;
    }


    /* =========================================
       ALERTS
    ========================================= */

    html[data-theme="dark"] .alert-light {
        background: var(--theme-surface-raised) !important;

        color: var(--theme-ink) !important;

        border-color: var(--theme-border) !important;
    }


    html[data-theme="dark"] .alert-info {
        background: #183A52 !important;

        color: #BBDDF3 !important;

        border-color: #285674 !important;
    }


    html[data-theme="dark"] .alert-success {
        background: #173B2D !important;

        color: #B7E4CD !important;

        border-color: #286347 !important;
    }


    html[data-theme="dark"] .alert-warning {
        background: #443718 !important;

        color: #F3DCA5 !important;

        border-color: #705B25 !important;
    }


    html[data-theme="dark"] .alert-danger {
        background: #431F24 !important;

        color: #F1B8BE !important;

        border-color: #6C3038 !important;
    }


    /* =========================================
       LOGIN
    ========================================= */

    html[data-theme="dark"] .login-card {
        background: var(--theme-surface) !important;

        color: var(--theme-ink) !important;

        border-color: var(--theme-border) !important;
    }


    html[data-theme="dark"] .login-title {
        color: var(--theme-ink) !important;
    }


    /* =========================================
       THEME TOGGLE IN DARK MODE
    ========================================= */

    html[data-theme="dark"] .theme-toggle {
        background: var(--theme-surface-raised);

        color: #F6D365;

        border-color: var(--theme-border);
    }


    html[data-theme="dark"] .theme-toggle:hover {
        background: #26394C;

        color: #FFD86B;
    }


    /* =========================================
       COMMON BORDERS
    ========================================= */

    html[data-theme="dark"] .border,
    html[data-theme="dark"] .border-top,
    html[data-theme="dark"] .border-bottom,
    html[data-theme="dark"] .border-start,
    html[data-theme="dark"] .border-end {
        border-color: var(--theme-border) !important;
    }


    /* =========================================
       HR
    ========================================= */

    html[data-theme="dark"] hr {
        border-color: var(--theme-border) !important;

        opacity: 1;
    }


    /* =========================================
       DARK MODE BOOTSTRAP TEXT
    ========================================= */

    html[data-theme="dark"] .text-dark {
        color: var(--theme-ink) !important;
    }


    html[data-theme="dark"] .text-secondary {
        color: var(--theme-muted) !important;
    }


    html[data-theme="dark"] .text-body {
        color: var(--theme-ink) !important;
    }


    /* =========================================
       SCRIPT / THEME INITIALIZATION
    ========================================= */
</style>


<script>
    (function () {

        const storageKey = 'citizen-services-theme';

        let savedTheme = null;


        try {

            savedTheme =
                localStorage.getItem(storageKey);

        } catch (error) {

            savedTheme = null;

        }


        const initialTheme =
            savedTheme ||
            (
                window.matchMedia &&
                window.matchMedia(
                    '(prefers-color-scheme: dark)'
                ).matches
                    ? 'dark'
                    : 'light'
            );


        /*
         * Apply theme immediately so the page
         * does not flash the wrong theme.
         */
        document.documentElement.dataset.theme =
            initialTheme;


        function updateThemeButtons(theme) {

            document
                .querySelectorAll('[data-theme-toggle]')
                .forEach(function (button) {

                    const switchToDark =
                        theme !== 'dark';


                    button.innerHTML =
                        switchToDark

                            ? '<i class="fa-solid fa-moon" aria-hidden="true"></i>'

                            : '<i class="fa-solid fa-sun" aria-hidden="true"></i>';


                    button.setAttribute(
                        'aria-label',
                        switchToDark
                            ? 'Switch to dark mode'
                            : 'Switch to light mode'
                    );


                    button.setAttribute(
                        'title',
                        switchToDark
                            ? 'Switch to dark mode'
                            : 'Switch to light mode'
                    );


                    button.setAttribute(
                        'aria-pressed',
                        String(theme === 'dark')
                    );

                });

        }


        document.addEventListener(
            'DOMContentLoaded',
            function () {

                updateThemeButtons(
                    document.documentElement.dataset.theme
                );


                document
                    .querySelectorAll('[data-theme-toggle]')
                    .forEach(function (button) {

                        button.addEventListener(
                            'click',
                            function () {

                                const currentTheme =
                                    document.documentElement.dataset.theme;


                                const nextTheme =
                                    currentTheme === 'dark'
                                        ? 'light'
                                        : 'dark';


                                document.documentElement.dataset.theme =
                                    nextTheme;


                                updateThemeButtons(
                                    nextTheme
                                );


                                try {

                                    localStorage.setItem(
                                        storageKey,
                                        nextTheme
                                    );

                                } catch (error) {

                                    /*
                                     * Theme still works for the
                                     * current page when storage
                                     * is unavailable.
                                     */

                                }

                            }
                        );

                    });

            }
        );

    })();
</script>
