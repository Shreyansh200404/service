{% extends 'base.html' %}

{% block content %}

<div class="container-fluid mt-4">

    <!-- Header -->

    <div class="medicine-header text-center mb-5">

        <div class="header-icon">

            <i class="fa-solid fa-capsules"></i>

        </div>

        <h1 class="medicine-title mt-3">

            {{ diagnosis.name }} Medicines

        </h1>

        <p class="medicine-subtitle">

            Search and view medicines with dosage information

        </p>

    </div>

    <!-- Search Bar -->

    <div class="search-wrapper mb-5">

        <div class="input-group custom-search">

            <span class="input-group-text">

                <i class="fa-solid fa-magnifying-glass"></i>

            </span>

            <input type="text"
                   id="searchInput"
                   class="form-control"
                   placeholder="Search Medicine...">

        </div>

    </div>

    <!-- Medicine Table Card -->

    <div class="table-card">

        <div class="table-header">

            <h3>

                <i class="fa-solid fa-table"></i>
                Medicine List

            </h3>

        </div>

        <div class="table-responsive">

            <table class="table custom-table table-hover align-middle"
                   id="medicineTable">

                <thead>

                    <tr>
                        <th>Medicine Name</th>
                        <th>Dosage</th>
                    </tr>

                </thead>

                <tbody>

                    {% for m in medicines %}

                    <tr>

                        <td>

                            <div class="medicine-name">

                                <i class="fa-solid fa-pills"></i>

                                {{ m.name }}

                            </div>

                        </td>

                        <td>

                            <span class="dosage-badge">

                                {{ m.dosage }}

                            </span>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Search Script -->

<script>

    const searchInput =
        document.getElementById('searchInput');

    searchInput.addEventListener(
        'keyup',
        function(){

            let filter =
                searchInput.value.toLowerCase();

            let rows =
                document.querySelectorAll(
                    '#medicineTable tbody tr'
                );

            rows.forEach(function(row){

                let text =
                    row.innerText.toLowerCase();

                if(text.includes(filter)){

                    row.style.display = "";

                }

                else{

                    row.style.display = "none";

                }

            });

        }
    );

</script>

<style>

    body{
        background:#eef4ff;
        font-family:Arial, sans-serif;
    }

    /* Header */

    .medicine-header{
        padding:20px;
    }

    .header-icon{
        width:90px;
        height:90px;
        background:linear-gradient(to right,#2563eb,#06b6d4);
        color:white;
        border-radius:50%;
        display:flex;
        justify-content:center;
        align-items:center;
        margin:auto;
        font-size:40px;
        box-shadow:0 8px 20px rgba(0,0,0,0.15);
    }

    .medicine-title{
        font-size:38px;
        font-weight:bold;
        color:#1e293b;
    }

    .medicine-subtitle{
        color:#64748b;
        font-size:16px;
    }

    /* Search Bar */

    .search-wrapper{
        max-width:550px;
        margin:auto;
    }

    .custom-search{
        border-radius:14px;
        overflow:hidden;
        box-shadow:0 6px 18px rgba(0,0,0,0.08);
    }

    .custom-search .input-group-text{
        background:white;
        border:none;
        color:#2563eb;
        padding-left:18px;
        font-size:18px;
    }

    .custom-search .form-control{
        border:none;
        padding:15px;
        font-size:16px;
    }

    .custom-search .form-control:focus{
        box-shadow:none;
    }

    /* Table Card */

    .table-card{
        background:white;
        border-radius:22px;
        padding:30px;
        box-shadow:0 10px 25px rgba(0,0,0,0.08);
    }

    .table-header{
        margin-bottom:25px;
    }

    .table-header h3{
        color:#1e293b;
        font-weight:600;
    }

    /* Table */

    .custom-table{
        border-radius:15px;
        overflow:hidden;
    }

    .custom-table thead{
        background:#2563eb;
        color:white;
    }

    .custom-table th{
        padding:16px;
        border:none;
        font-size:15px;
    }

    .custom-table td{
        padding:16px;
        vertical-align:middle;
    }

    .custom-table tbody tr:hover{
        background:#f8fafc;
    }

    /* Medicine Name */

    .medicine-name{
        display:flex;
        align-items:center;
        gap:10px;
        font-weight:600;
        color:#1e293b;
    }

    .medicine-name i{
        color:#2563eb;
        font-size:18px;
    }

    /* Dosage Badge */

    .dosage-badge{
        background:#dbeafe;
        color:#2563eb;
        padding:8px 14px;
        border-radius:20px;
        font-weight:600;
        font-size:14px;
    }

</style>

{% endblock %}
