{% extends 'admin_base.html' %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center">

    <div class="card custom-card">

        <!-- Header -->

        <div class="card-header text-center">

            <div class="icon-box">

                <i class="fa-solid fa-capsules"></i>

            </div>

            <h2 class="mt-3">
                Edit Medicine
            </h2>

            <p class="text-light">
                Update medicine details and dosage information
            </p>

        </div>

        <!-- Body -->

        <div class="card-body">

            <form method="POST"
                  id="updateMedicineForm">

                {% csrf_token %}

                <!-- Diagnosis -->

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        Diagnosis

                    </label>

                    {{ form.diagnosis }}

                </div>

                <!-- Medicine Name -->

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        Medicine Name

                    </label>

                    {{ form.name }}

                </div>

                <!-- Dosage -->

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        Dosage

                    </label>

                    {{ form.dosage }}

                </div>

                <!-- Buttons -->

                <div class="d-flex justify-content-between">

                    <a href="{% url 'admin_dashboard' %}"
                       class="btn btn-secondary btn-custom">

                        <i class="fa-solid fa-arrow-left"></i>
                        Cancel

                    </a>

                    <button type="submit"
                            class="btn btn-warning btn-custom text-white">

                        <i class="fa-solid fa-floppy-disk"></i>
                        Update Medicine

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- Update Confirmation Modal -->

<div class="modal fade"
     id="updateMedicineModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header bg-warning text-white">

                <h5 class="modal-title">

                    Confirm Update

                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body text-center">

                <i class="fa-solid fa-circle-check fa-4x text-warning mb-3"></i>

                <h4 class="fw-bold">
                    Update Medicine?
                </h4>

                <p class="text-muted">

                    Are you sure you want to save these medicine changes?

                </p>

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button type="button"
                        class="btn btn-warning text-white"
                        onclick="submitMedicineForm()">

                    Yes Update

                </button>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

    let allowMedicineSubmit = false;

    function submitMedicineForm(){

        allowMedicineSubmit = true;

        document.getElementById('updateMedicineForm').submit();

    }

    document.getElementById('updateMedicineForm')
    .addEventListener('submit', function(event){

        if(!allowMedicineSubmit){

            event.preventDefault();

            var myModal =
            new bootstrap.Modal(
                document.getElementById('updateMedicineModal')
            );

            myModal.show();

        }

    });

</script>

<style>

    body{
        background:#eef4ff;
    }

    .custom-card{
        width:100%;
        max-width:650px;
        border:none;
        border-radius:22px;
        overflow:hidden;
        margin-top:40px;
        box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    .card-header{
        background:linear-gradient(to right,#2563eb,#06b6d4);
        padding:35px;
        color:white;
    }

    .icon-box{
        width:85px;
        height:85px;
        background:white;
        border-radius:50%;
        display:flex;
        justify-content:center;
        align-items:center;
        margin:auto;
        color:#2563eb;
        font-size:38px;
        box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .card-body{
        padding:40px;
        background:white;
    }

    /* Django Form Styling */

    input,
    select{
        width:100%;
        padding:14px;
        border-radius:12px;
        border:1px solid #d1d5db;
        transition:0.3s;
        font-size:15px;
    }

    input:focus,
    select:focus{
        border-color:#2563eb;
        box-shadow:0 0 10px rgba(37,99,235,0.25);
        outline:none;
    }

    .btn-custom{
        padding:12px 22px;
        border-radius:10px;
        font-weight:600;
        transition:0.3s;
    }

    .btn-warning:hover{
        background:#ea580c;
    }

    .btn-secondary:hover{
        background:#4b5563;
    }

    .modal-content{
        border-radius:20px;
        overflow:hidden;
        border:none;
    }

    .modal-header{
        padding:18px 25px;
    }

    .modal-body{
        padding:35px;
    }

    .modal-footer{
        padding:20px;
    }

</style>

{% endblock %}
