{% extends 'base.html' %}

{% block content %}

<style>
    :root {
        --navy: #073D70;
        --navy-dark: #123F78;
        --coral: #E86B4C;
        --coral-dark: #D95638;
        --coral-soft: #FFF0EB;

        --cream: #FFF4DF;
        --blue-light: #E9F5FC;
        --blue-border: #D7EBF8;

        --green: #249B63;
        --green-dark: #19734A;
        --green-light: #EAF7F0;

        --text: #172033;
        --muted: #64748B;
        --border: #DCE5ED;
    }

    .password-success-page {
        min-height: 65vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 45px 15px;
    }

    .success-card {
        width: 100%;
        max-width: 560px;

        overflow: hidden;

        background: #fff;

        border: 1px solid var(--border);

        border-radius: 20px;

        box-shadow:
            0 12px 35px rgba(7, 61, 112, .10);
    }

    .success-top {
        height: 7px;

        background: linear-gradient(
            90deg,
            var(--navy) 0%,
            var(--navy) 55%,
            var(--coral) 55%,
            var(--coral) 100%
        );
    }

    .success-body {
        padding: 45px 40px;
    }

    .success-icon {
        width: 72px;
        height: 72px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin: 0 auto 20px;

        border-radius: 18px;

        background: var(--green-light);

        color: var(--green);

        border: 1px solid #C8E7D6;

        box-shadow:
            0 7px 18px rgba(36, 155, 99, .10);
    }

    .success-icon i {
        font-size: 30px;
    }

    .success-title {
        color: var(--navy);

        font-size: 27px;
        font-weight: 750;

        margin-bottom: 9px;
    }

    .success-message {
        max-width: 420px;

        margin: 0 auto 25px;

        color: var(--muted);

        font-size: 13px;
        line-height: 1.7;
    }

    .success-note {
        display: flex;
        align-items: center;
        justify-content: center;

        gap: 7px;

        margin-bottom: 25px;

        color: var(--green-dark);

        font-size: 11px;
        font-weight: 600;
    }

    .signin-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        gap: 8px;

        min-width: 190px;

        padding: 11px 20px;

        border-radius: 9px;

        background: var(--coral);

        border: 1px solid var(--coral);

        color: #fff;

        font-size: 13px;
        font-weight: 650;

        text-decoration: none;

        box-shadow:
            0 5px 14px rgba(232, 107, 76, .18);

        transition: .2s ease;
    }

    .signin-btn:hover {
        background: var(--coral-dark);

        border-color: var(--coral-dark);

        color: #fff;

        transform: translateY(-1px);

        box-shadow:
            0 8px 18px rgba(232, 107, 76, .23);
    }

    @media (max-width: 576px) {

        .password-success-page {
            padding: 30px 12px;
        }

        .success-body {
            padding: 35px 22px;
        }

        .success-title {
            font-size: 23px;
        }

        .signin-btn {
            width: 100%;
        }
    }
</style>


<div class="container password-success-page">

    <section class="success-card mx-auto text-center">

        <div class="success-top"></div>

        <div class="success-body">

            <div class="success-icon">

                <i class="fa-solid fa-circle-check"></i>

            </div>


            <h1 class="success-title">
                Password Changed
            </h1>


            <p class="success-message">
                Your password has been updated successfully.
                Sign in with your new password to continue using
                the SEVA ONE citizen services portal.
            </p>


            <div class="success-note">

                <i class="fa-solid fa-shield-halved"></i>

                Your account is now secured with your new password.

            </div>


            <a href="{% url 'login' %}" class="signin-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Return to Sign In

            </a>

        </div>

    </section>

</div>

{% endblock %}
