{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <section class="card mx-auto text-center shadow-sm" style="max-width:560px">
        <div class="card-body p-5">
            <span class="rounded-3 p-3 bg-success-subtle text-success d-inline-block mb-3"><i class="fa-solid fa-circle-check fa-xl"></i></span>
            <h1 class="h3 fw-bold">Password changed</h1>
            <p class="text-muted">Your password has been updated. Sign in with your new password.</p>
            <a href="{% url 'login' %}" class="btn btn-primary">Return to sign in</a>
        </div>
    </section>
</div>
{% endblock %}
